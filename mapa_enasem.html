<style>

  #app { display:flex; width:100vw; height:100vh; min-height:600px; position:relative; }

  #sidebar.collapsed { width:0; flex-basis:0; overflow:hidden; border-right:0; }
  .sidebar-inner { width:310px; min-height:100%; padding:18px; }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
  h1 { margin:0; font-size:19px; line-height:1.25; color:#1f2937; }
  .subtitle { margin:5px 0 0; font-size:12px; color:#6b7280; }
  button { cursor:pointer; }
  .close { border:0; background:#f3f4f6; border-radius:8px; min-width:40px; min-height:40px; font-size:23px; line-height:1; color:#374151; }
  label { display:block; margin:0 0 7px; font-weight:700; font-size:13px; color:#374151; }
  select { width:100%; min-height:44px; padding:9px 11px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; font-size:16px; color:#111827; }
  #summary { margin-top:14px; padding:11px 12px; background:#f3f4f6; border-radius:8px; font-size:13px; color:#374151; }
  .legend { margin-top:18px; display:grid; gap:9px; }
  .legend-title { font-weight:700; font-size:13px; color:#374151; margin-bottom:1px; }
  .legend-row { display:flex; align-items:center; gap:9px; font-size:13px; color:#4b5563; }
  .legend-dot { width:15px; height:15px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.28); flex:none; }
  #mapwrap { position:relative; flex:1 1 auto; min-width:0; height:100%; }
  #map { position:absolute; inset:0; width:100%; height:100%; min-height:600px; background:#dbeafe; }
  #openSidebar { position:absolute; top:16px; left:16px; z-index:1100; width:46px; height:46px; border:0; border-radius:9px; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25); font-size:23px; display:none; align-items:center; justify-content:center; }
  #sidebar.collapsed ~ #mapwrap #openSidebar { display:flex; }

<div id="app">

    <div class="sidebar-inner">
      <div class="head">
        <div><h1>ENASEM · Planeación y semanas</h1><p class="subtitle">Consulta la planeación, semana o localiza un CUNICAH.</p></div>

      <div class="control-group">

      </div>
      <label for="weekSelect">Semana a desplegar</label>

        <div class="legend-row"><span class="legend-dot" style="background:#2563eb"></span>Semana 1</div>

        <div class="legend-row"><span class="legend-dot" style="background:#ea580c"></span>Semana 3</div>
        <div class="legend-row"><span class="legend-dot" style="background:#9333ea"></span>Semana 4</div>
        <div class="legend-row"><span class="legend-dot" style="background:#dc2626"></span>Semana 5</div>
      </div>
    </div>
  </aside>
  <div id="mapwrap">
    <div id="map" aria-label="Mapa ENASEM"></div>
    <button id="openSidebar" type="button" aria-label="Mostrar panel">☰</button>
    <button id="locateBtn" type="button" aria-label="Activar mi ubicación" aria-pressed="false" title="Mi ubicación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
    </button>

    <div id="mapError" class="map-error"><strong>No fue posible cargar el mapa base.</strong><br>Comprueba que el equipo tenga acceso a Internet y vuelve a abrir el archivo.</div>
  </div>
</div>

UNICAH":15967,"SUBHOG":0,"NP":10,"SEMANA":3},{"PLANEACIÓN":"Ajustada","CVEGEO":"0801900015090036","xcoord":-106.10750005942,"ycoord":28.6032027409592,"CUNICAH":15969,"SUBHOG":0,"NP":20,"SEMANA":4},{"PLANEACIÓN":"Ajustada","CVEGEO":"0801900015283015","xcoord":-106.039318639796,"ycoord":28.6017126847153,"CUNICAH":15974,"SUBHOG":0,"NP":10,"SEMANA":3},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700011715024","xcoord":-106.442686073525,"ycoord":31.6733712134831,"CUNICAH":15995,"SUBHOG":0,"NP":10,"SEMANA":1},{"PLANEACIÓN":"Ajustada","CVEGEO":"080370001222A134","xcoord":-106.352500379458,"ycoord":31.6885008241252,"CUNICAH":15997,"SUBHOG":0,"NP":10,"SEMANA":2},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700012770026","xcoord":-106.443747789747,"ycoord":31.702669773638,"CUNICAH":16000,"SUBHOG":0,"NP":10,"SEMANA":1},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700015258016","xcoord":-106.408533792906,"ycoord":31.7004539914844,"CUNICAH":16005,"SUBHOG":0,"NP":10,"SEMANA":2},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700015258016","xcoord":-106.412675378899,"ycoord":31.7026818259638,"CUNICAH":16007,"SUBHOG":0,"NP":10,"SEMANA":2},{"PLANEACIÓN":"Ajustada","CVEGEO":"0801300010537042","xcoord":-107.949329537748,"ycoord":30.3708571046693,"CUNICAH":16026,"SUBHOG":0,"NP":10,"SEMANA":5},{"PLANEACIÓN":"Ajustada","CVEGEO":"0801300010537013","xcoord":-107.948846767912,"ycoord":30.3719580509887,"CUNICAH":16028,"SUBHOG":0,"NP":10,"SEMANA":5},{"PLANEACIÓN":"Ajustada","CVEGEO":"0801300010537043","xcoord":-107.950010763577,"ycoord":30.3706462098297,"CUNICAH":16030,"SUBHOG":12,"NP":20,"SEMANA":5},{"PLANEACIÓN":"Ajustada","CVEGEO":"0804000341246026","xcoord":-108.065040364148,"ycoord":29.4539382794493,"CUNICAH":16049,"SUBHOG":0,"NP":10,"SEMANA":5},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700016595046","xcoord":-106.402410184733,"ycoord":31.5832724118153,"CUNICAH":21071,"SUBHOG":0,"NP":10,"SEMANA":2},{"PLANEACIÓN":"Ajustada","CVEGEO":"080370001521A044","xcoord":-106.369348922835,"ycoord":31.6445901910435,"CUNICAH":21083,"SUBHOG":0,"NP":10,"SEMANA":2},{"PLANEACIÓN":"Ajustada","CVEGEO":"0801900018305002","xcoord":-105.962210568634,"ycoord":28.6544562383443,"CUNICAH":21091,"SUBHOG":0,"NP":10,"SEMANA":3},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700015883017","xcoord":-106.353155787712,"ycoord":31.6226759509734,"CUNICAH":21109,"SUBHOG":0,"NP":10,"SEMANA":2},{"PLANEACIÓN":"Ajustada","CVEGEO":"0803700011471041","xcoord":-106.490081240679,"ycoord":31.7177979823339,"CUNICAH":24372,"SUBHOG":0,"NP":10,"SEMANA":1}];
  const weekColors={1:'#2563eb',2:'#16a34a',3:'#ea580c',4:'#9333ea',5:'#dc2626'};
  const sidebar=document.getElementById('sidebar');
  const weekSelect=document.getElementById('weekSelect');
  const summary=document.getElementById('summary');
  const cunicaSearch=document.getElementById('cunicaSearch');
  const searchMsg=document.getElementById('searchMsg');
  const mapError=document.getElementById('mapError');

  if (typeof L === 'undefined') { mapError.style.display='block'; return; }

  const map=L.map('map',{zoomControl:true, preferCanvas:true});
  const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'&copy; OpenStreetMap contributors'});
  tiles.addTo(map);
  tiles.on('tileerror', function() { /* Map remains usable even if an individual tile fails. */ });
  const markerLayer=L.layerGroup().addTo(map);

  function popupHtml(p) {
    const lat = Number(p.ycoord);
    const lng = Number(p.xcoord);
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lat + ',' + lng);
    return '<div class="popup-title">'+p['PLANEACIÓN']+' · Semana '+p.SEMANA+'</div><div class="popup-grid">'+
      '<div class="k">CVEGEO</div><div class="v">'+p.CVEGEO+'</div>'+
      '<div class="k">CUNICAH</div><div class="v">'+p.CUNICAH+'</div>'+
      '<div class="k">SUBHOG</div><div class="v">'+p.SUBHOG+'</div>'+
      '<div class="k">NP</div><div class="v">'+p.NP+'</div></div>'+
      '<a class="gmaps-btn" href="'+mapsUrl+'" target="_blank" rel="noopener noreferrer">Google Maps</a>';
  }
  function iconFor(week) {
    const color=weekColors[week]||'#475569';
    return L.divIcon({className:'', html:'<div class="marker-pin" style="background:'+color+'"></div>', iconSize:[30,36], iconAnchor:[15,34], popupAnchor:[0,-32]});
  }
  function selectedPlanning(){
    const checked=document.querySelector('input[name="planning"]:checked');
    return checked ? checked.value : 'Ajustada';
  }
  function filteredPoints(){
    const selected=weekSelect.value;
    const planning=selectedPlanning();
    return points.filter(p => p['PLANEACIÓN']===planning && (selected==='all' || String(p.SEMANA)===selected));
  }
  function render(focusCunica=null) {
    markerLayer.clearLayers();
    const selected=weekSelect.value;
    const planning=selectedPlanning();
    const filtered=filteredPoints();
    const coords=[];
    let focusMarker=null, focusPoint=null;
    filtered.forEach(p=>{
      const lat=Number(p.ycoord), lng=Number(p.xcoord);
      if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
      const marker=L.marker([lat,lng],{icon:iconFor(p.SEMANA),title:p['PLANEACIÓN']+' · Semana '+p.SEMANA+' · CUNICAH '+p.CUNICAH}).bindPopup(popupHtml(p)).addTo(markerLayer);
      coords.push([lat,lng]);
      if(focusCunica!==null && String(p.CUNICAH).trim()===String(focusCunica).trim()){ focusMarker=marker; focusPoint=[lat,lng]; }
    });
    summary.textContent=coords.length+' marcas visibles · '+planning+(selected==='all'?' · Todas las semanas':' · Semana '+selected);
    if(focusPoint){ map.setView(focusPoint,16); setTimeout(()=>focusMarker.openPopup(),120); }
    else if(coords.length===1) map.setView(coords[0],14);
    else if(coords.length>1) map.fitBounds(coords,{padding:[45,45],maxZoom:14});
    setTimeout(()=>map.invalidateSize(true),60);
  }
  function searchCunica(){
    const q=cunicaSearch.value.trim();
    if(!q){ searchMsg.textContent='Escribe un CUNICAH para buscar.'; return; }
    const planning=selectedPlanning();
    const inPlanning=points.filter(p=>p['PLANEACIÓN']===planning && String(p.CUNICAH).trim()===q);
    if(!inPlanning.length){ searchMsg.textContent='No se encontró CUNICAH '+q+' en planeación '+planning+'.'; return; }
    const weeks=[...new Set(inPlanning.map(p=>String(p.SEMANA)))];
    if(weekSelect.value!=='all' && !weeks.includes(weekSelect.value)){ weekSelect.value='all'; }
    searchMsg.textContent='CUNICAH '+q+' localizado en planeación '+planning+'.';
    render(q);
  }
  weekSelect.addEventListener('change',()=>{searchMsg.textContent='';render();});
  document.querySelectorAll('input[name="planning"]').forEach(r=>r.addEventListener('change',()=>{searchMsg.textContent='';render();}));
  document.getElementById('searchBtn').addEventListener('click',searchCunica);
  cunicaSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCunica();}});
  document.getElementById('closeSidebar').addEventListener('click',()=>{sidebar.classList.add('collapsed');setTimeout(()=>map.invalidateSize(true),300);});
  document.getElementById('openSidebar').addEventListener('click',()=>{sidebar.classList.remove('collapsed');setTimeout(()=>map.invalidateSize(true),300);});
  window.addEventListener('resize',()=>map.invalidateSize(false));

  // ---- Ubicación del usuario (activar / desactivar) ----
  const locateBtn=document.getElementById('locateBtn');
  const locToast=document.getElementById('locToast');
  let watchId=null, userMarker=null, userCircle=null, firstFix=false, toastTimer=null;
  function toast(msg,ms){
    locToast.textContent=msg; locToast.style.display='block';
    clearTimeout(toastTimer);
    if(ms) toastTimer=setTimeout(()=>{locToast.style.display='none';},ms);
  }
  function setLocateState(on,searching){
    locateBtn.classList.toggle('active',on);
    locateBtn.classList.toggle('searching',!!searching);
    locateBtn.setAttribute('aria-pressed',on?'true':'false');
    locateBtn.setAttribute('aria-label',on?'Desactivar mi ubicación':'Activar mi ubicación');
  }
  function stopLocate(){
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    if(userMarker){ map.removeLayer(userMarker); userMarker=null; }
    if(userCircle){ map.removeLayer(userCircle); userCircle=null; }
    firstFix=false;
    setLocateState(false,false);
  }
  function onLocate(pos){
    const ll=[pos.coords.latitude,pos.coords.longitude], acc=pos.coords.accuracy||0;
    if(!userMarker){
      userCircle=L.circle(ll,{radius:acc,interactive:false,color:'#2563eb',weight:1,fillColor:'#2563eb',fillOpacity:.12}).addTo(map);
      userMarker=L.marker(ll,{interactive:false,keyboard:false,zIndexOffset:1000,icon:L.divIcon({className:'',html:'<div class="user-loc-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
    } else { userMarker.setLatLng(ll); userCircle.setLatLng(ll).setRadius(acc); }
    if(!firstFix){
      firstFix=true;
      setLocateState(true,false);
      map.setView(ll,Math.max(map.getZoom(),16));
      toast('Ubicación activada (±'+Math.round(acc)+' m)',2500);
    }
  }
  function onLocateError(err){
    const msgs={1:'Permiso de ubicación denegado. Habilítalo en el navegador.',2:'No se pudo determinar tu ubicación.',3:'Se agotó el tiempo para obtener tu ubicación.'};
    stopLocate();
    toast(msgs[err.code]||'No se pudo obtener tu ubicación.',4000);
  }
  function startLocate(){
    if(!('geolocation' in navigator)){ toast('Tu navegador no soporta geolocalización.',4000); return; }
    setLocateState(true,true);
    toast('Buscando tu ubicación…');
    watchId=navigator.geolocation.watchPosition(onLocate,onLocateError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }
  locateBtn.addEventListener('click',()=>{
    if(watchId!==null){ stopLocate(); toast('Ubicación desactivada',1500); } else { startLocate(); }
  });
  L.DomEvent.disableClickPropagation(locateBtn);
  window.addEventListener('pagehide',()=>{ if(watchId!==null) navigator.geolocation.clearWatch(watchId); });

  render();
  setTimeout(()=>map.invalidateSize(true),250);
})();
</script>
